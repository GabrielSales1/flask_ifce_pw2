{% extends "layout.html"%}
{% block content %}
<h1>Cadastro de Produtos</h1>

<form action="{{url_for('salvarProduto')}}" 
  method="POST">
        <div class="content_login">
        <div class="content_login_interno">
        <input type="text" maxlength="20" name="codigo"  value="{{produto.codigo}}" placeholder="Digite o Código " class="content_input">
        
        </div>

        <div class="content_login_interno">
        <input type="text" maxlength="100" name="descricao"  value="{{produto.descricao}}" required placeholder="Digite a Descrição " class="content_input">
        
        </div>

         <div class="content_login_interno">
        <input type="number"  step='0.01' value="{{produto.preco}}" name="preco" required placeholder="Digite o preço " class="content_input">
        
        </div>

        <input type="submit" value="Enviar" class="button">

        </div>
            {% if msg %}
        <p style="color: red;">{{ msg }}</p>
            {% endif %}
        {% if produto.id %}
         <input type="hidden" name="id" value="{{produto.id}}">
        {% endif %}
        
    </form>
{% endblock %}
