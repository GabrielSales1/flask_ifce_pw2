{% extends "layout.html"%}
{% block content %}
<h1>Lista de Clientes</h1>
<br>

</div>
<table style="border: 2pt solid black;">
    <tr>
        <th >Código</th>
        <th >Nome</th>
        <th >Email</th>
        <th >Endereço</th>
        <th >Telefone</th>
        <th >Editar</th>
         <th >Excluir</th>
    </tr>
    {% for c in clientes %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.nome }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.endereco }}</td>
        <td>{{ c.telefone }}</td>
        <td><a href="{{url_for('update_cliente', id=c.id)}}">Editar</a></td>
        <td><a onclick="return confirm('Deseja realmente excluir?')" href="{{url_for('delete_cliente', id=c.id)}}">Excluir</a></td>
    </tr>
    {%endfor%} 

</table>

{% endblock %}
