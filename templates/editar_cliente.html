{% extends 'layout.html' %}

{% block content %}

<form method="POST">

    <input type="text"
           name="nome"
           value="{{ cliente.nome }}"
           required>

    <br><br>

    <input type="email"
           name="email"
           value="{{ cliente.email }}"
           required>

    <br><br>

    <input type="text"
           name="telefone"
           value="{{ cliente.telefone }}"
           required>

    <br><br>

    <button type="submit">
        Atualizar
    </button>

</form>

{% endblock %}
